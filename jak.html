<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeunesse Al Khaïry — Visite de Cheikh Ould Khaiïry 2026</title>
<meta name="description" content="Jeunesse Al Khaïry (JAK) : présentation, membres et fondateurs. Organisateur de la visite de Cheikh Ould Khaiïry à Dakar en juillet 2026.">
<link rel="canonical" href="https://jak.sn/jak.html">
<link rel="icon" href="/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/logo.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Jeunesse Al Khaïry">
<meta property="og:title" content="Jeunesse Al Khaïry — Visite de Cheikh Ould Khaiïry 2026">
<meta property="og:description" content="Présentation, membres et fondateurs de Jeunesse Al Khaïry, organisateur de la visite du Cheikh.">
<meta property="og:url" content="https://jak.sn/jak.html">
<meta property="og:image" content="https://jak.sn/image_cheikh.png">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jak.sn/image_cheikh.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="site.css">
<script src="data.js"></script>
<script src="site.js"></script>
</head>
<body>
<main>
  <header class="hero wrap" style="padding-bottom:16px">
    <img src="logo.png" alt="Logo JAK" style="height:90px;border-radius:14px;background:#fff;padding:8px"
      onerror="this.style.display='none'">
    <p class="eyebrow" id="pgEyebrow"></p>
    <h1>Jeunesse Al Khaïry</h1>
  </header>
  <section><div class="wrap">
    <div class="panel"><p id="jakPres"></p></div>
  </div></section>
  <div id="grpCaro" style="margin-top:6px"></div>
  <section><div class="wrap">
    <h2 class="sec-label" id="secMembres"></h2>
    <div class="cards" id="jakGrid"></div>
  </div></section>
  <div id="soutienMount"></div>
</main>
<script>
(function(){
  const D=window.SITE_DATA;
  renderChrome('jak');
  document.getElementById('pgEyebrow').textContent=D.settings.event_nom+' · '+D.settings.dates_texte;
  document.getElementById('jakPres').innerHTML=todoWrap(D.settings.jak_presentation);
  document.getElementById('secMembres').textContent=T('jak_membres');
  // fondateurs d'abord
  const membres=[...(D.jak||[])].sort((a,b)=>(b.fondateur==='OUI')-(a.fondateur==='OUI'));
  document.getElementById('jakGrid').innerHTML=membres.map(p=>
    personCard(p,{fondateur:p.fondateur==='OUI',fonction:p.fonction})).join('')||'<p class="muted">—</p>';
  initCarousel(document.getElementById('grpCaro'),
    membres.filter(p=>p.photo).map(p=>({src:p.photo,legende:p.nom_complet,fonction:p.fonction,bio:p.biographie,adresse:p.adresse,fondateur:p.fondateur==='OUI'})),{delay:3600});
  document.getElementById('soutienMount').outerHTML=soutienBlock();
})();
</script>
</body>
</html>
